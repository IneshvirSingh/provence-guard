# Local dependencies for development and integration tests. All images pinned.
# Self-hosted Langfuse is deliberately NOT here (see docs/adr/ADR-001-stack.md, "Observability").
services:
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: provguard
      POSTGRES_PASSWORD: provguard  # local dev only
      POSTGRES_DB: provguard
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U provguard -d provguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports: ["6333:6333", "6334:6334"]
    volumes: ["qdrant:/qdrant/storage"]
    healthcheck:
      # The qdrant image has no curl/wget; open a TCP socket to the REST port instead.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  qdrant:
